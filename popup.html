<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unredact Mountain Project</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; padding: 14px; width: 250px;
    }
    h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: .01em; }
    .row { display: flex; justify-content: space-between; padding: 3px 0; }
    .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
    .muted { opacity: .6; }
    hr { border: 0; border-top: 1px solid rgba(128,128,128,.3); margin: 10px 0; }
    label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
    button {
      width: 100%; margin-top: 10px; padding: 6px; cursor: pointer;
      border: 1px solid rgba(128,128,128,.4); border-radius: 4px; background: transparent;
      color: inherit; font: inherit;
    }
    button:hover { background: rgba(128,128,128,.15); }
    #status { margin-top: 8px; min-height: 1.2em; font-size: 12px; opacity: .7; }
  </style>
</head>
<body>
  <h1>Unredact Mountain Project</h1>

  <label><input type="checkbox" id="enabled" checked> Enabled</label>

  <hr>

  <div class="row"><span>Names cached</span><span id="resolved">–</span></div>
  <div class="row"><span>&nbsp;&nbsp;routes</span><span id="routes">–</span></div>
  <div class="row"><span>&nbsp;&nbsp;areas</span><span id="areas">–</span></div>
  <div class="row muted"><span>Unresolved</span><span id="misses">–</span></div>
  <div class="row muted"><span>Data version</span><span id="dataVersion">–</span></div>

  <button id="clear">Clear cached names</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
